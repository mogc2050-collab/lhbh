name: Build Android APK - Manual Only

# IMPORTANT: no push, pull_request, schedule, or release triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medieval-life-manual-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Generate installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository intentionally contains no generated android/ directory.
      # Create the latest compatible Android scaffolding on GitHub's runner.
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=medieval_life --org=com.mamlakatlife .

      - name: Apply Arabic app identity and custom launcher icon
        run: python3 scripts/customize_android.py

      - name: Download Flutter dependencies
        run: flutter pub get

      - name: Test game economy
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Mamlakat-Al-Hayat-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
