name: Build iBetoo Media APK - Manual Only

# Manually requested from GitHub Actions. No push / pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      test_on_android:
        description: Install and launch on Android emulator after building
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ibetoo-media-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Check, sign, package and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout new media app
        uses: actions/checkout@v4

      - name: Set up Java 21 for AGP lint compatibility
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Verify Java 21 and pinned Flutter toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java_major=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.specification.version = //p' | head -1)
          if [[ "$java_major" != "21" ]]; then
            echo "::error::Android lint in AGP 9.3 needs JDK 21; detected $java_major"
            exit 1
          fi

      - name: Create independent Android application
        run: flutter create --platforms=android --project-name=ibetoo_media --org=com.ibetoo .

      - name: Validate native build scripts before Android packaging
        run: |
          python3 -m py_compile scripts/customize_android.py
          bash -n scripts/verify_apk.sh
          bash -n scripts/emulator_smoke.sh
          bash -n scripts/build_apk_retry.sh
          bash -n scripts/test_build_apk_retry.sh

      - name: Test retry policy offline (429, 503, compilation, signing)
        run: bash scripts/test_build_apk_retry.sh

      - name: Configure offline media indexing, biometric access, browser and signing
        run: python3 scripts/customize_android.py

      - name: Bundle uBlock Origin (Firefox WebExtension) into app assets
        shell: bash
        run: |
          set -uo pipefail
          dest=android/app/src/main/assets/web_extensions/ublock-origin
          mkdir -p "$dest"
          if curl -fsSL --retry 3 --max-time 120 \
              -o "$RUNNER_TEMP/ublock.xpi" \
              "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi" \
             && unzip -q -o "$RUNNER_TEMP/ublock.xpi" -d "$dest" \
             && test -s "$dest/manifest.json"; then
            echo "uBlock Origin bundled: $(grep -m1 '"version"' "$dest/manifest.json")"
          else
            rm -rf "$dest"
            echo "::warning::uBlock Origin could not be downloaded; APK is built WITHOUT network ad blocking"
          fi

      # Flutter creates android/ during this workflow, so install Gradle
      # caching only AFTER the wrapper and Android project have been generated.
      - name: Validate generated media permissions and native player bridges
        shell: bash
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          native=android/app/src/main/kotlin/com/ibetoo/ibetoo_media
          test -s "$native/MainActivity.kt"
          test -s "$native/DeviceMediaBridge.kt"
          test ! -e lib/src/downloads_screen.dart
          test ! -e lib/src/link_inspector.dart
          grep -q 'android.app.DownloadManager' "$native/MainActivity.kt"
          grep -q 'downloadUrl' "$native/MainActivity.kt"
          grep -q 'downloadUrl' lib/src/platform_bridge.dart
          grep -q 'READ_MEDIA_AUDIO' "$manifest"
          grep -q 'READ_MEDIA_VIDEO' "$manifest"
          grep -q 'POST_NOTIFICATIONS' "$manifest"
          grep -q 'READ_MEDIA_IMAGES' "$manifest"
          grep -q 'USE_BIOMETRIC' "$manifest"
          grep -q 'DeviceMediaBridge(this' "$native/MainActivity.kt"
          test -s "$native/GeckoEngine.kt"
          test -s "$native/GeckoBridge.kt"
          grep -q 'GeckoBridge(this' "$native/MainActivity.kt"
          test -s android/app/src/main/assets/web_extensions/aflaak-core/manifest.json
          grep -q 'org.mozilla.geckoview:geckoview' android/app/build.gradle*
          ! grep -rq 'webview_flutter' pubspec.yaml
          grep -q 'MediaStore.Audio.Media' "$native/DeviceMediaBridge.kt"
          grep -q 'MediaStore.Video.Media' "$native/DeviceMediaBridge.kt"
          echo 'GeckoView browser engine, offline MediaStore library, biometric security, playback and Android DownloadManager bridge generated.'

      - name: Restore and persist Gradle wrapper and Maven dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Gradle daemon uses Java 21
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --stop || true
          ./gradlew --version
          echo "Gradle JVM: $(java -version 2>&1 | head -1)"

      - name: Load optional PRIVATE signing
        shell: bash
        env:
          PRIVATE_KEYSTORE_BASE64: ${{ secrets.MEDIA_KEYSTORE_BASE64 }}
          PRIVATE_STORE_PASSWORD: ${{ secrets.MEDIA_STORE_PASSWORD }}
          PRIVATE_KEY_ALIAS: ${{ secrets.MEDIA_KEY_ALIAS }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.MEDIA_KEY_PASSWORD }}
        run: |
          if [[ -n "$PRIVATE_KEYSTORE_BASE64" ]]; then
            if [[ -z "$PRIVATE_STORE_PASSWORD" || -z "$PRIVATE_KEY_ALIAS" || -z "$PRIVATE_KEY_PASSWORD" ]]; then
              echo "Incomplete media signing secrets" >&2
              exit 1
            fi
            printf '%s' "$PRIVATE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ibetoo-private.jks"
            {
              echo "MEDIA_KEYSTORE_PATH=$RUNNER_TEMP/ibetoo-private.jks"
              echo "MEDIA_STORE_PASSWORD=$PRIVATE_STORE_PASSWORD"
              echo "MEDIA_KEY_ALIAS=$PRIVATE_KEY_ALIAS"
              echo "MEDIA_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using configured private media signing key"
          else
            echo "Using PUBLIC TEST KEY ONLY. Configure MEDIA_ secrets before production distribution."
          fi

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze source for Dart compile issues
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log" || {
            echo '## Dart analyzer errors' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^| )error •|^error -|error •|undefined_|non_constant_|expected_|invalid_' "$RUNNER_TEMP/flutter-analyze.log" | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
            echo "::group::Dart analyzer errors only"
            grep -E '(^| )error •|^error -|error •|undefined_|non_constant_|expected_|invalid_' "$RUNNER_TEMP/flutter-analyze.log" || true
            echo "::endgroup::"
            exit 1
          }

      - name: Upload analyzer diagnostics if validation fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-analyzer-diagnostics
          path: ${{ runner.temp }}/flutter-analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run media app unit tests
        run: flutter test

      - name: Build universal signed APK with bounded network-only retries
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: bash scripts/build_apk_retry.sh

      - name: Verify signature, package, native runtime and integrity
        run: bash scripts/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare single direct APK download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/iBetoo-Media.apk
          sha256sum dist/iBetoo-Media.apk > dist/iBetoo-Media.sha256

      - name: Publish direct APK without ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/iBetoo-Media.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Allow KVM
        if: ${{ inputs.test_on_android }}
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Test actual installation and app launch
        if: ${{ inputs.test_on_android }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          script: bash scripts/emulator_smoke.sh dist/iBetoo-Media.apk

      - name: Build instructions
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## iBetoo Media - ملف التثبيت'
            echo ''
            echo 'من تشغيل الـActions الحالي، افتح Artifacts وحمّل **iBetoo-Media.apk** بدون ZIP.'
            echo 'إذا فشل التحليل أو الاختبار، لا تُعتبر النسخة جاهزة للتثبيت.'
            echo 'التطبيق لا يستخدم أي شبكة إعلانات داخلية؛ صفحات الويب الخارجية قد تحتوي على إعلانات.'
            echo 'Google login needs a valid Google OAuth app, registered Android SHA-1, and GOOGLE_WEB_CLIENT_ID secret.'
          } >> "$GITHUB_STEP_SUMMARY"
