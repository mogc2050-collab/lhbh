name: Build APK Direct (Manual Only)

# Run only from GitHub > Actions > Run workflow. NEVER build on push.
on:
  workflow_dispatch:
    inputs:
      test_installation_on_emulator:
        description: 'Install and launch APK on Android emulator (recommended)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: medieval-life-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build, sign, verify and publish direct APK
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show installed tool versions
        run: |
          flutter --version
          java -version

      - name: Generate Android project on GitHub runner
        run: flutter create --platforms=android --project-name=medieval_life --org=com.mamlakatlife .

      - name: Apply identity, icons and stable signing for test installations
        run: python3 scripts/customize_android.py

      # Optional PRIVATE signing for later production. If unset, an openly shared
      # demo-only key is used so test builds have a stable signing certificate.
      - name: Load private signing key when secrets are configured
        env:
          PRIVATE_KEYSTORE_BASE64: ${{ secrets.KINGDOM_KEYSTORE_BASE64 }}
          PRIVATE_STORE_PASSWORD: ${{ secrets.KINGDOM_STORE_PASSWORD }}
          PRIVATE_KEY_ALIAS: ${{ secrets.KINGDOM_KEY_ALIAS }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.KINGDOM_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$PRIVATE_KEYSTORE_BASE64" ]]; then
            if [[ -z "$PRIVATE_STORE_PASSWORD" || -z "$PRIVATE_KEY_ALIAS" || -z "$PRIVATE_KEY_PASSWORD" ]]; then
              echo 'ERROR: Private keystore provided but a password or alias secret is missing.' >&2
              exit 1
            fi
            printf '%s' "$PRIVATE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kingdom-private.jks"
            echo "KINGDOM_KEYSTORE_PATH=$RUNNER_TEMP/kingdom-private.jks" >> "$GITHUB_ENV"
            echo "KINGDOM_STORE_PASSWORD=$PRIVATE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KINGDOM_KEY_ALIAS=$PRIVATE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KINGDOM_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'Using private signing keystore from Actions secrets.'
          else
            echo 'Using bundled TEST-ONLY keystore. Not safe for app-store/public production.'
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run project tests
        run: flutter test

      - name: Build signed universal APK for all Flutter Android architectures
        shell: bash
        run: |
          flutter build apk --release --build-number "$((100000 + GITHUB_RUN_NUMBER))"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify actual APK signature, manifest and file integrity
        run: bash scripts/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare direct APK download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Mamlakat-Al-Hayat.apk
          sha256sum dist/Mamlakat-Al-Hayat.apk > dist/SHA256.txt

      # Since Feb 2026, archive:false enables single-file downloads from the UI.
      - name: Upload APK DIRECTLY without ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/Mamlakat-Al-Hayat.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Permit hardware-accelerated emulator access
        if: ${{ inputs.test_installation_on_emulator }}
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi

      - name: Install APK and open the game on an Android emulator
        if: ${{ inputs.test_installation_on_emulator }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          script: bash scripts/emulator_smoke.sh dist/Mamlakat-Al-Hayat.apk

      - name: Show download instructions
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## تنزيل اللعبة APK مباشرة'
            echo ''
            echo 'افتح تشغيل الـ Action الحالي، ثم من قسم **Artifacts** اضغط **Mamlakat-Al-Hayat.apk**.'
            echo 'هذا ملف APK مباشر، وليس ZIP، بفضل `upload-artifact@v7` و `archive:false`.'
            echo ''
            echo 'لو فشل اختبار المحاكي بعد رفع الملف، راجع خطوة **Install APK and open the game** لمعرفة السبب.'
          } >> "$GITHUB_STEP_SUMMARY"
