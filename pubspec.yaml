name: ibetoo_media
description: Ad-free Arabic media organizer, browser and authorized file downloader.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  video_player: ^2.14.0
  file_picker: ^13.3.3
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
